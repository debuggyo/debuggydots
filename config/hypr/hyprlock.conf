$text_color = rgba(ffffffdd)
$text_color_clock = rgba(ffffffff)
$entry_background_color = rgba(ffffff25)
$entry_border_color = rgba(ffffff35)
$entry_color = rgba(ffffffFF)
$font_family = Adwaita Sans Bold
$font_family_clock = Adwaita Sans Black
$font_material_symbols = Material Symbols Rounded

background {
    # color = rgba(010409FF)
    path = screenshot

    # path = screenshot
    blur_size = 10
    blur_passes = 3
    noise = 0.1
    brightness = 0.4
}
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.1
    dots_spacing = 0.3
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    fade_on_empty = true

    position = 0, -100
    halign = center
    valign = center
}

label { # Clock
    monitor =
    text = $TIME
    color = $text_color_clock
    font_size = 100
    font_family = $font_family_clock

    position = 0, 100
    halign = center
    valign = center
}
label { # Date
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = $text_color
    font_size = 20
    font_family = $font_family

    position = 0, 20
    halign = center
    valign = center
}
