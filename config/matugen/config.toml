[config.wallpaper]
command = "swww"
arguments = ["img", "--transition-type", "center"]
set = true

[templates.waybar]
input_path = './templates/colors.css'
output_path = '~/.config/waybar/niri/matucolors.css'
post_hook = 'pkill -SIGUSR2 waybar'

[templates.eww]
input_path = './templates/colors.scss'
output_path = '~/.config/eww/colors.scss'
post_hook = 'pkill -SIGUSR2 eww'

[templates.wofi]
input_path = './templates/colors.css'
output_path = '~/.config/wofi/colors.css'

[templates.kitty]
input_path = './templates/kitty.conf'
output_path = '~/.config/kitty/colors.conf'
post_hook = 'pkill -SIGUSR1 kitty'

[templates.gtk3]
input_path = './templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-dark'

[templates.gtk4]
input_path = './templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'

[templates.qt5ct]
input_path = './templates/qt-colors.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = './templates/qt-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.dunst]
input_path = './templates/dunstrc'
output_path = '~/.config/dunst/dunstrc'
post_hook = 'pkill dunst'
